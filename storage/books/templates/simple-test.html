<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Retro Dendy Messenger</title>

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background-color: #eaf2f8; 
    background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.05) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 2px, transparent 2px);
    background-size: 32px 32px;
    color: #111;
}

.chat {
    max-width: 720px;
    margin: 40px auto;
    padding: 16px;
}

.msg {
    display: flex;
    margin: 24px 0;
    align-items: flex-end;
}

.left { justify-content: flex-start; }
.right { justify-content: flex-end; }

.msg-col {
    display: flex;
    flex-direction: column;
    max-width: 70%;
}

.left .msg-col { align-items: flex-start; }
.right .msg-col { align-items: flex-end; }

.avatar {
    width: 36px;
    height: 36px;
    border: 3px solid #000;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin: 0 12px;
    box-shadow: 2px 2px 0 #000;
    flex-shrink: 0;
}

.bubble {
    position: relative;
    padding: 12px 16px;
    font-size: 15px;
    line-height: 1.4;
    border: 3px solid #000;
    box-shadow: 4px 4px 0 #000;
    word-wrap: break-word;
    width: fit-content;
}

.left .bubble {
    background: #ffffff;
    border-radius: 20px 20px 20px 4px;
}

.right .bubble {
    background: #e3f2fd;
    border-radius: 20px 20px 4px 20px;
}

.name {
    font-size: 12px;
    font-weight: 800;
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.system {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #000c16;
    margin: 24px auto;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.meta {
    font-size: 12px;
    color: #9e8c8c;
    margin-top: 8px;
    font-style: italic;
    opacity: 0.9;
    border-top: 1px dashed #bbb;
    padding-top: 6px;
}

.reactions {
    position: absolute;
    bottom: -16px;
    background: #fff;
    border: 2px solid #000;
    border-radius: 12px;
    padding: 2px 6px;
    font-size: 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    box-shadow: 2px 2px 0 #000;
    z-index: 10;
    white-space: nowrap;
}

.left .reactions { right: -12px; }
.right .reactions { left: -12px; }

.reaction-count {
    font-size: 11px;
    font-weight: bold;
    color: #444;
}

@media (max-width: 600px) {
    .chat {
        margin: 10px auto;
        padding: 10px;
    }
    .msg {
        margin: 20px 0;
    }
    .msg-col {
        max-width: 85%;
    }
    .bubble {
        padding: 10px 14px;
        font-size: 14px;
    }
    .avatar {
        width: 30px;
        height: 30px;
        font-size: 15px;
        margin: 0 8px;
        border-width: 2px;
    }
}
</style>
</head>

<body>

<div class="chat" id="chat"></div>

<script type="application/json" id="book-data">

</script>

<script>
const data = JSON.parse(document.getElementById("book-data").textContent);
const chat = document.getElementById("chat");

const charMap = new Map(data.characters.map(c => [c.id, c]));

function getColor(id) {
    const colors = ["#2196f3", "#f44336", "#4caf50", "#ff9800", "#9c27b0", "#e91e63", "#607d8b", "#795548", "#009688"];
    return colors[id % colors.length];
}

function avatar(id) {
    const icons = ["👽", "🧑‍🚀", "🤖", "🧔", "🦖", "🌟", "👾", "🧙‍♂️", "👻"];
    return icons[id % icons.length];
}

function getRandomReactions() {
    if (Math.random() > 0.7) return null; 

    const emojis = ['👍', '😂', '😮', '🚀', '🔥', '👎', '🌌'];
    const count = Math.random() > 0.8 ? 2 : 1;
    const selected = [];
    
    for (let i = 0; i < count; i++) {
        const r = emojis[Math.floor(Math.random() * emojis.length)];
        if (!selected.includes(r)) selected.push(r);
    }
    
    if (selected.length === 0) return null;

    const div = document.createElement("div");
    div.className = "reactions";
    div.innerHTML = selected.map(e => `
        <span>
            ${e} <span class="reaction-count">${Math.floor(Math.random() * 5) + 1}</span>
        </span>
    `).join('');
    
    return div;
}

function createMessage({ text, name, isRight, color, metaText, authorId }) {
    const div = document.createElement("div");
    div.className = "msg " + (isRight ? "right" : "left");

    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = avatar(authorId);
    av.style.borderColor = color;

    const col = document.createElement("div");
    col.className = "msg-col";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const textDiv = document.createElement("div");
    textDiv.textContent = text;
    bubble.appendChild(textDiv);

    if (metaText) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = metaText;
        bubble.appendChild(meta);
    }

    const reactions = getRandomReactions();
    if (reactions) {
        bubble.appendChild(reactions);
    }

    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = name;
    nameDiv.style.color = color;

    col.appendChild(nameDiv);
    col.appendChild(bubble);
    

    if (isRight) {
        div.appendChild(col);
        div.appendChild(av);
    } else {
        div.appendChild(av);
        div.appendChild(col);
    }

    return div;
}

function render(line) {
    if (!line.is_dialogue) {
        const sys = document.createElement("div");
        sys.className = "system";
        sys.textContent = line.content;
        return [sys];
    }

    let aId = line.author_id;
    let name = "Невідомий";
    
    if (aId !== null) {
        const char = charMap.get(aId);
        name = char?.name || "Невідомий";
    } else {
        aId = 999;
    }

    const color = getColor(aId);
    const isRight = aId === 1;

    const messages = [];

    if (line.parts && line.parts.length) {
        messages.push(
            createMessage({
                text: line.parts[0].trim(),
                name,
                isRight,
                color,
                metaText: line.parts[1]?.trim(),
                authorId: aId
            })
        );

        for (let i = 2; i < line.parts.length; i++) {
            const part = line.parts[i].trim();
            if (!part) continue;

            messages.push(
                createMessage({
                    text: part,
                    name,
                    isRight,
                    color,
                    authorId: aId
                })
            );
        }
    } else {
        messages.push(
            createMessage({
                text: line.content,
                name,
                isRight,
                color,
                authorId: aId
            })
        );
    }

    return messages;
}

data.lines.forEach(line => {
    render(line).forEach(el => chat.appendChild(el));
});
</script>

</body>
</html>
