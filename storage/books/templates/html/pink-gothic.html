<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>{{ title }}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Mochi突&display=swap');

*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Fredoka', 'Mochi突', sans-serif;
    font-weight: 700;
    background-color: #f7eff6;
    background-image: 
        linear-gradient(to right, rgba(154, 44, 219, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(154, 44, 219, 0.03) 1px, transparent 1px);
    background-size: 28px 28px;
    color: #2b1636;
    -webkit-font-smoothing: antialiased;
}

.chat {
    max-width: 680px;
    margin: 20px auto;
    padding: 16px;
    width: 100%;
}

.msg {
    display: flex;
    margin: 26px 0;
    align-items: flex-end;
    break-inside: avoid;
    page-break-inside: avoid;
}

.left { justify-content: flex-start; }
.right { justify-content: flex-end; }

.msg-col {
    display: flex;
    flex-direction: column;
    max-width: 78%;
}

.left .msg-col { align-items: flex-start; }
.right .msg-col { align-items: flex-end; }

.avatar {
    width: 46px;
    height: 46px;
    border: 1.5px solid #2b1636;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin: 0 10px;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 0 3px 0 #2b1636;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.bubble {
    position: relative;
    padding: 12px 18px;
    font-size: 19px;
    line-height: 1.4;
    border: 1.5px solid #2b1636;
    word-wrap: break-word;
    width: fit-content;
    break-inside: avoid;
    page-break-inside: avoid;
    box-shadow: 3px 3px 0 #2b1636;
}

.left .bubble {
    background: #ffffff;
    border-radius: 18px 18px 18px 4px;
}

.right .bubble {
    background: #fbcbf4;
    border-radius: 18px 18px 4px 18px;
}

.name {
    font-size: 11px;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1.5px solid #2b1636;
    color: #ffffff;
    box-shadow: 2px 2px 0 #2b1636;
    width: fit-content;
}

.system {
    text-align: center;
    font-size: 19px;
    line-height: 1.4;
    color: #ffffff;
    margin: 36px auto;
    padding: 10px 22px;
    border: 1.5px solid #2b1636;
    border-radius: 12px;
    background: #7209b7;
    max-width: 85%;
    text-transform: uppercase;
    letter-spacing: 1px;
    break-inside: avoid;
    page-break-inside: avoid;
    box-shadow: 3px 3px 0 #2b1636;
}

.meta {
    font-size: 13px;
    margin-top: 8px;
    padding-top: 6px;
}

.left .meta {
    border-top: 1px dashed rgba(43, 22, 54, 0.2);
    color: #6d597a;
}

.right .meta {
    border-top: 1px dashed rgba(43, 22, 54, 0.2);
    color: #6d597a;
}

.reactions {
    position: absolute;
    bottom: -16px;
    background: #ffffff;
    border: 1.5px solid #2b1636;
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 13px;
    display: flex;
    gap: 4px;
    align-items: center;
    z-index: 10;
    white-space: nowrap;
    box-shadow: 2px 2px 0 #2b1636;
}

.left .reactions { right: 10px; }
.right .reactions { left: 10px; }

.reaction-count {
    color: #2b1636;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="chat" id="chat"></div>

<script type="application/json" id="book-data">
{{ json_data }}
</script>

<script>
const data = JSON.parse(document.getElementById("book-data").textContent);
const chat = document.getElementById("chat");

const charMap = new Map(data.characters.map(c => [c.id, c]));

function getColor(id) {
    const colors = ["#ff758f", "#7209b7", "#4cc9f0", "#f72585", "#3a0ca3", "#ffb703", "#b5179e"];
    return colors[Math.abs(id) % colors.length];
}

function getFallbackEmoji(id) {
    const icons = ['🦇', '🦄', '🩸', '🎀', '🧛', '🧁', '⭐', '💀', '🌸'];
    return icons[Math.abs(id) % icons.length];
}

function getRandomReactions() {
    if (Math.random() > 0.7) return null;

    const emojis = ['🦇', '🎀', '🧛', '🩸', '🌟', '🧁', '🖤'];
    const count = Math.random() > 0.8 ? 2 : 1;
    const selected = [];
    
    for (let i = 0; i < count; i++) {
        const r = emojis[Math.floor(Math.random() * emojis.length)];
        if (!selected.includes(r)) selected.push(r);
    }
    
    if (selected.length === 0) return null;

    const div = document.createElement("div");
    div.className = "reactions";
    div.innerHTML = selected.map(e => `
        <span>
            ${e} <span class="reaction-count">${Math.floor(Math.random() * 5) + 1}</span>
        </span>
    `).join('');
    
    return div;
}

function createMessage({ text, name, isRight, color, metaText, authorId, avatarUrl }) {
    const div = document.createElement("div");
    div.className = "msg " + (isRight ? "right" : "left");

    const av = document.createElement("div");
    av.className = "avatar";

    if (avatarUrl) {
        const img = document.createElement("img");
        img.src = avatarUrl;
        img.alt = name;
        img.onerror = function() {
            av.textContent = getFallbackEmoji(authorId);
        };
        av.appendChild(img);
    } else {
        av.textContent = getFallbackEmoji(authorId);
    }

    const col = document.createElement("div");
    col.className = "msg-col";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const textDiv = document.createElement("div");
    textDiv.textContent = text;
    bubble.appendChild(textDiv);

    if (metaText) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = metaText;
        bubble.appendChild(meta);
    }

    const reactions = getRandomReactions();
    if (reactions) {
        bubble.appendChild(reactions);
    }

    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = name;
    nameDiv.style.backgroundColor = color;
    
    col.appendChild(nameDiv);
    col.appendChild(bubble);

    if (isRight) {
        div.appendChild(col);
        div.appendChild(av);
    } else {
        div.appendChild(av);
        div.appendChild(col);
    }

    return div;
}

function render(line) {
    if (!line.is_dialogue) {
        const sys = document.createElement("div");
        sys.className = "system";
        sys.textContent = line.content;
        return [sys];
    }

    let aId = line.author_id;
    let name = "Невідомий";
    let avatarUrl = null;
    
    if (aId !== null) {
        const char = charMap.get(aId);
        name = char?.name || "Невідомий";
        avatarUrl = char?.avatar || null;
    } else {
        aId = 999;
    }

    const color = getColor(aId);
    const isRight = (aId % 2 !== 0);

    const messages = [];
    const partsToShow = (line.parts && line.parts.length > 0) ? line.parts : [line.content];
    
    let targetIndex = line.author_index !== null && line.author_index !== undefined ? line.author_index - 1 : partsToShow.length - 1;
    if (targetIndex < 0) {
        targetIndex = 0;
    }

    partsToShow.forEach((part, index) => {
        const text = part.trim();
        if (!text) return;

        let metaText = null;
        const authorText = line.author_text || line.author_part;
        if (authorText && index === targetIndex) {
            metaText = authorText.trim();
        }

        messages.push(
            createMessage({
                text,
                name,
                isRight,
                color,
                metaText,
                authorId: aId,
                avatarUrl
            })
        );
    });

    return messages;
}

data.lines.forEach(line => {
    render(line).forEach(el => chat.appendChild(el));
});
</script>

</body>
</html>
