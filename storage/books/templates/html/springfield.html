<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>{{ title }}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&display=swap');

*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
    font-weight: 700;
    background-color: #70d1fe;
    background-image: radial-gradient(#ffffff 2px, transparent 2px);
    background-size: 24px 24px;
    color: #000000;
    -webkit-font-smoothing: antialiased;
}

.chat {
    max-width: 720px;
    margin: 20px auto;
    padding: 16px;
    width: 100%;
}

.msg {
    display: flex;
    margin: 32px 0;
    align-items: flex-end;
    break-inside: avoid;
    page-break-inside: avoid;
}

.left { justify-content: flex-start; }
.right { justify-content: flex-end; }

.msg-col {
    display: flex;
    flex-direction: column;
    max-width: 75%;
}

.left .msg-col { align-items: flex-start; }
.right .msg-col { align-items: flex-end; }

.avatar {
    width: 44px;
    height: 44px;
    border: 1px solid #000000;
    border-radius: 50%;
    background: #ffd90f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin: 0 12px;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.bubble {
    position: relative;
    padding: 12px 18px;
    font-size: 19px;
    line-height: 1.4;
    border: 1px solid #000000;
    word-wrap: break-word;
    width: fit-content;
    break-inside: avoid;
    page-break-inside: avoid;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
}

.left .bubble {
    background: #ffffff;
    border-radius: 18px 18px 18px 4px;
}

.right .bubble {
    background: #ffd90f;
    border-radius: 18px 18px 4px 18px;
}

.name {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 0 #ffffff;
}

.system {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    line-height: 1.5;
    color: #000000;
    margin: 40px auto;
    padding: 12px 20px;
    border: 1px dashed #000000;
    border-radius: 24px;
    background: #ff80b5;
    max-width: 85%;
    text-transform: uppercase;
    break-inside: avoid;
    page-break-inside: avoid;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
}

.meta {
    font-size: 13px;
    color: #333;
    margin-top: 10px;
    border-top: 1px solid #000000;
    padding-top: 8px;
    font-weight: 700;
}

.reactions {
    position: absolute;
    bottom: -18px;
    background: #ffffff;
    border: 1px solid #000000;
    border-radius: 14px;
    padding: 2px 8px;
    font-size: 14px;
    display: flex;
    gap: 6px;
    align-items: center;
    z-index: 10;
    white-space: nowrap;
    box-shadow: 1px 1px 0 rgba(0,0,0,0.2);
}

.left .reactions { right: 12px; }
.right .reactions { left: 12px; }

.reaction-count {
    font-weight: bold;
    color: #000000;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="chat" id="chat"></div>

<script type="application/json" id="book-data">
{{ json_data }}
</script>

<script>
const data = JSON.parse(document.getElementById("book-data").textContent);
const chat = document.getElementById("chat");

const charMap = new Map(data.characters.map(c => [c.id, c]));

function getColor(id) {
    const colors = ["#ff3b30", "#0072ce", "#00a859", "#f05e23", "#9c27b0", "#005fa3", "#e6194b"];
    return colors[Math.abs(id) % colors.length];
}

function getFallbackEmoji(id) {
    const icons = ['👨‍🦲', '👱‍♀️', '👦', '👧', '👶', '👴', '👽', '🤡', '👮'];
    return icons[Math.abs(id) % icons.length];
}

function getRandomReactions() {
    if (Math.random() > 0.7) return null;

    const emojis = ['🍩', '🍺', '📺', '🛹', '🎷', '☢️', '☁️'];
    const count = Math.random() > 0.8 ? 2 : 1;
    const selected = [];
    
    for (let i = 0; i < count; i++) {
        const r = emojis[Math.floor(Math.random() * emojis.length)];
        if (!selected.includes(r)) selected.push(r);
    }
    
    if (selected.length === 0) return null;

    const div = document.createElement("div");
    div.className = "reactions";
    div.innerHTML = selected.map(e => `
        <span>
            ${e} <span class="reaction-count">${Math.floor(Math.random() * 5) + 1}</span>
        </span>
    `).join('');
    
    return div;
}

function createMessage({ text, name, isRight, color, metaText, authorId, avatarUrl }) {
    const div = document.createElement("div");
    div.className = "msg " + (isRight ? "right" : "left");

    const av = document.createElement("div");
    av.className = "avatar";

    if (avatarUrl) {
        const img = document.createElement("img");
        img.src = avatarUrl;
        img.alt = name;
        img.onerror = function() {
            av.textContent = getFallbackEmoji(authorId);
        };
        av.appendChild(img);
    } else {
        av.textContent = getFallbackEmoji(authorId);
    }

    const col = document.createElement("div");
    col.className = "msg-col";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const textDiv = document.createElement("div");
    textDiv.textContent = text;
    bubble.appendChild(textDiv);

    if (metaText) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = metaText;
        bubble.appendChild(meta);
    }

    const reactions = getRandomReactions();
    if (reactions) {
        bubble.appendChild(reactions);
    }

    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = name;
    nameDiv.style.color = color;
    
    col.appendChild(nameDiv);
    col.appendChild(bubble);

    if (isRight) {
        div.appendChild(col);
        div.appendChild(av);
    } else {
        div.appendChild(av);
        div.appendChild(col);
    }

    return div;
}

function render(line) {
    if (!line.is_dialogue) {
        const sys = document.createElement("div");
        sys.className = "system";
        sys.textContent = line.content;
        return [sys];
    }

    let aId = line.author_id;
    let name = "Невідомий";
    let avatarUrl = null;
    
    if (aId !== null) {
        const char = charMap.get(aId);
        name = char?.name || "Невідомий";
        avatarUrl = char?.avatar || null;
    } else {
        aId = 999;
    }

    const color = getColor(aId);
    const isRight = (aId % 2 !== 0);

    const messages = [];
    const partsToShow = (line.parts && line.parts.length > 0) ? line.parts : [line.content];
    
    let targetIndex = line.author_index !== null && line.author_index !== undefined ? line.author_index - 1 : partsToShow.length - 1;
    if (targetIndex < 0) {
        targetIndex = 0;
    }

    partsToShow.forEach((part, index) => {
        const text = part.trim();
        if (!text) return;

        let metaText = null;
        const authorText = line.author_text || line.author_part;
        if (authorText && index === targetIndex) {
            metaText = authorText.trim();
        }

        messages.push(
            createMessage({
                text,
                name,
                isRight,
                color,
                metaText,
                authorId: aId,
                avatarUrl
            })
        );
    });

    return messages;
}

data.lines.forEach(line => {
    render(line).forEach(el => chat.appendChild(el));
});
</script>

</body>
</html>
