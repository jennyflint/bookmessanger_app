<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
        <title>{{ title }}</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
            rel="stylesheet" />
        <style>
* {
    box-sizing: border-box;
}

html {
    margin: 0;
    padding: 0;
}

body {
    margin: 0;
    padding: 0;
    color: #2b2b2b;
    font-family: Inter, system-ui, sans-serif;
    background-color: #f6f8fc;
    background-image:
        linear-gradient(rgba(100,100,100,.06) 1px, transparent 1px),
        linear-gradient(
            90deg,
            rgba(100,100,100,.06) 1px,
            transparent 1px
        );
    background-size: 24px 24px;
}

.chat {
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
    padding: 16px;
}

.msg {
    display: flex;
    align-items: flex-end;
    margin: 16px 0;
    page-break-inside: avoid;
    break-inside: avoid;
}

.left {
    justify-content: flex-start;
}

.right {
    justify-content: flex-end;
}

.msg-col {
    display: flex;
    flex-direction: column;
    max-width: 78%;
}

.left .msg-col {
    align-items: flex-start;
}

.right .msg-col {
    align-items: flex-end;
}

.avatar {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 50%;
    background: white;
    border: 1px solid #d6dceb;
    margin: 0 8px;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.bubble {
    padding: 12px 14px;
    line-height: 1.7;
    font-size: 17px;
    border-radius: 18px;
    border: 1px solid #d8dfea;
    box-shadow: 0 2px 4px rgba(0,0,0,.04);
    page-break-inside: avoid;
    break-inside: avoid;
    word-break: break-word;
}

.left .bubble {
    background: white;
    border-bottom-left-radius: 6px;
}

.right .bubble {
    background: #eef7ff;
    border-bottom-right-radius: 6px;
}

.name {
    font-size: 11px;
    line-height: 1.5;
    margin-bottom: 6px;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
    font-weight: bold;
}

.meta {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #d6dceb;
    color: #666;
    font-size: 13px;
}

.system {
    margin: 24px auto;
    max-width: 700px;
    font-size: 19px;
    background: white;
    border: 1px solid #d8dfea;
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    line-height: 1.7;
    color: #555;
    page-break-inside: avoid;
    break-inside: avoid;
}
</style>
    </head>

    <body>

        <div id="chat" class="chat"></div>

        <script id="book-data" type="application/json">
{{ json_data }}
</script>

        <script>
const data = JSON.parse(document.getElementById("book-data").textContent);
const chat = document.getElementById("chat");
const charMap = new Map(data.characters.map(c => [c.id, c]));

function getColor(id) {
    const colors = [
        "#3730a3",
        "#0369a1",
        "#15803d",
        "#c2410c",
        "#7e22ce",
        "#be185d",
        "#0e7490",
        "#a16207"
    ];
    return colors[Math.abs(id) % colors.length];
}

function getFallbackEmoji(id) {
    const icons = ["👽", "🤖", "🧙", "🚀", "👾", "🌟", "🛰️", "🪐"];
    return icons[Math.abs(id) % icons.length];
}

function createMessage({ text, name, isRight, color, metaText, authorId, avatarUrl }) {
    const root = document.createElement("div");
    root.className = "msg " + (isRight ? "right" : "left");

    const avatar = document.createElement("div");
    avatar.className = "avatar";

    if (avatarUrl) {
        const img = document.createElement("img");
        img.src = avatarUrl;
        img.alt = name;
        img.onerror = () => {
            avatar.textContent = getFallbackEmoji(authorId);
        };
        avatar.appendChild(img);
    } else {
        avatar.textContent = getFallbackEmoji(authorId);
    }

    const col = document.createElement("div");
    col.className = "msg-col";

    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = name;
    nameDiv.style.color = color;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    if (metaText) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = metaText;
        bubble.appendChild(meta);
    }

    col.appendChild(nameDiv);
    col.appendChild(bubble);

    if (isRight) {
        root.appendChild(col);
        root.appendChild(avatar);
    } else {
        root.appendChild(avatar);
        root.appendChild(col);
    }

    return root;
}

function renderLine(line) {
    if (!line.is_dialogue) {
        const sys = document.createElement("div");
        sys.className = "system";
        sys.textContent = line.content;
        return [sys];
    }

    let authorId = line.author_id;
    let name = "Невідомий";
    let avatarUrl = null;

    if (authorId !== null) {
        const character = charMap.get(authorId);
        if (character) {
            name = character.name;
            avatarUrl = character.avatar || null;
        }
    } else {
        authorId = 999;
    }

    const color = getColor(authorId);
    const isRight = authorId % 2 === 0;
    const result = [];

    const partsToShow = (line.parts && line.parts.length > 0) ? line.parts : [line.content];
    
    let targetIndex = line.author_index !== null && line.author_index !== undefined ? line.author_index - 1 : partsToShow.length - 1;
    if (targetIndex < 0) targetIndex = 0;

    partsToShow.forEach((part, index) => {
        const text = part.trim();
        if (!text) return;

        let metaText = null;
        const authorText = line.author_text || line.author_part;
        if (authorText && index === targetIndex) {
            metaText = authorText.trim();
        }

        result.push(
            createMessage({
                text,
                name,
                isRight,
                color,
                metaText,
                authorId,
                avatarUrl
            })
        );
    });

    return result;
}

data.lines.forEach(line => {
    renderLine(line).forEach(el => chat.appendChild(el));
});
</script>
    </body>
</html>
