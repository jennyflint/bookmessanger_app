<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>{{ title }}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap');

*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 19px;
    background-color: #0b0e14;
    background-image: 
        linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
    background-size: 20px 20px;
    color: #e0e6ed;
    -webkit-font-smoothing: antialiased;
}

.chat {
    max-width: 720px;
    margin: 20px auto;
    padding: 16px;
    width: 100%;
}

.msg {
    display: flex;
    margin: 32px 0;
    align-items: flex-end;
    break-inside: avoid;
    page-break-inside: avoid;
}

.left { justify-content: flex-start; }
.right { justify-content: flex-end; }

.msg-col {
    display: flex;
    flex-direction: column;
    max-width: 75%;
}

.left .msg-col { align-items: flex-start; }
.right .msg-col { align-items: flex-end; }

.avatar {
    width: 42px;
    height: 42px;
    border: 1px solid;
    border-radius: 50%;
    background: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin: 0 12px;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.bubble {
    position: relative;
    padding: 14px 18px;
    font-size: 19px;
    line-height: 1.4;
    border: 1px solid;
    word-wrap: break-word;
    width: fit-content;
    break-inside: avoid;
    page-break-inside: avoid;
    backdrop-filter: blur(4px);
}

.left .bubble {
    background: rgba(16, 32, 48, 0.85);
    border-color: #00d2ff;
    border-radius: 16px 16px 16px 4px;
    box-shadow: 0 0 10px rgba(0, 210, 255, 0.2), inset 0 0 8px rgba(0, 210, 255, 0.1);
}

.right .bubble {
    background: rgba(48, 16, 16, 0.85);
    border-color: #ff2a2a;
    border-radius: 16px 16px 4px 16px;
    box-shadow: 0 0 10px rgba(255, 42, 42, 0.2), inset 0 0 8px rgba(255, 42, 42, 0.1);
}

.name {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.system {
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.6;
    color: #ffcc00;
    margin: 40px auto;
    padding: 12px 20px;
    border: 1px dashed #ffcc00;
    border-radius: 12px;
    background: rgba(40, 30, 0, 0.8);
    max-width: 85%;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    break-inside: avoid;
    page-break-inside: avoid;
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.15);
}

.meta {
    font-size: 14px;
    color: #8892b0;
    margin-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    padding-top: 8px;
    font-weight: 500;
}

.reactions {
    position: absolute;
    bottom: -16px;
    background: #111827;
    border: 1px solid;
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 13px;
    display: flex;
    gap: 6px;
    align-items: center;
    z-index: 10;
    white-space: nowrap;
}

.left .reactions { 
    right: 12px; 
    border-color: #00d2ff;
    box-shadow: 0 0 5px rgba(0, 210, 255, 0.3);
}
.right .reactions { 
    left: 12px; 
    border-color: #ff2a2a;
    box-shadow: 0 0 5px rgba(255, 42, 42, 0.3);
}

.reaction-count {
    font-weight: 700;
    color: #ffffff;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="chat" id="chat"></div>

<script type="application/json" id="book-data">
    {{ json_data }}
</script>

<script>
const data = JSON.parse(document.getElementById("book-data").textContent);
const chat = document.getElementById("chat");

const charMap = new Map(data.characters.map(c => [c.id, c]));

function getColor(id) {
    const colors = ["#00ffff", "#ff3366", "#00ffaa", "#ffcc00", "#d580ff", "#33ccff", "#ff5588"];
    return colors[id % colors.length];
}

function getFallbackEmoji(id) {
    const icons = ['🚀', '👽', '🤖', '👾', '🛸', '☄️', '🌌', '🖖', '🛰️'];
    return icons[id % icons.length];
}

function getRandomReactions() {
    if (Math.random() > 0.7) return null;

    const emojis = ['🖖', '🚀', '⭐', '⚔️', '🛰️', '🛸', '🌌'];
    const count = Math.random() > 0.8 ? 2 : 1;
    const selected = [];
    
    for (let i = 0; i < count; i++) {
        const r = emojis[Math.floor(Math.random() * emojis.length)];
        if (!selected.includes(r)) selected.push(r);
    }
    
    if (selected.length === 0) return null;

    const div = document.createElement("div");
    div.className = "reactions";
    div.innerHTML = selected.map(e => `
        <span>
            ${e} <span class="reaction-count">${Math.floor(Math.random() * 5) + 1}</span>
        </span>
    `).join('');
    
    return div;
}

function createMessage({ text, name, isRight, color, metaText, authorId, avatarUrl }) {
    const div = document.createElement("div");
    div.className = "msg " + (isRight ? "right" : "left");

    const av = document.createElement("div");
    av.className = "avatar";
    av.style.borderColor = color;
    av.style.boxShadow = `0 0 8px ${color}40`;

    if (avatarUrl) {
        const img = document.createElement("img");
        img.src = avatarUrl;
        img.alt = name;
        img.onerror = function() {
            av.textContent = getFallbackEmoji(authorId);
        };
        av.appendChild(img);
    } else {
        av.textContent = getFallbackEmoji(authorId);
    }

    const col = document.createElement("div");
    col.className = "msg-col";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const textDiv = document.createElement("div");
    textDiv.textContent = text;
    bubble.appendChild(textDiv);

    if (metaText) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = metaText;
        bubble.appendChild(meta);
    }

    const reactions = getRandomReactions();
    if (reactions) {
        bubble.appendChild(reactions);
    }

    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = name;
    nameDiv.style.color = color;
    nameDiv.style.textShadow = `0 0 5px ${color}60`;
    
    col.appendChild(nameDiv);
    col.appendChild(bubble);

    if (isRight) {
        div.appendChild(col);
        div.appendChild(av);
    } else {
        div.appendChild(av);
        div.appendChild(col);
    }

    return div;
}

function render(line) {
    if (!line.is_dialogue) {
        const sys = document.createElement("div");
        sys.className = "system";
        sys.textContent = line.content;
        return [sys];
    }

    let aId = line.author_id;
    let name = "Невідомий";
    let avatarUrl = null;
    
    if (aId !== null) {
        const char = charMap.get(aId);
        name = char?.name || "Невідомий";
        avatarUrl = char?.avatar || null;
    } else {
        aId = 999;
    }

    const color = getColor(aId);
    const isRight = (aId % 2 !== 0);

    const messages = [];
    
    let partsToShow = (line.parts && line.parts.length > 0) ? line.parts : [line.content];
    
    let targetIndex = line.author_index !== null ? line.author_index - 1 : partsToShow.length - 1;
    if (targetIndex < 0) targetIndex = 0;

    partsToShow.forEach((part, index) => {
        const text = part.trim();
        if (!text) return;

        let metaText = null;
        if (line.author_part && index === targetIndex) {
            metaText = line.author_part.trim();
        }

        messages.push(
            createMessage({
                text,
                name,
                isRight,
                color,
                metaText,
                authorId: aId,
                avatarUrl
            })
        );
    });

    return messages;
}

data.lines.forEach(line => {
    render(line).forEach(el => chat.appendChild(el));
});
</script>

</body>
</html>
