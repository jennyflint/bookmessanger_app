<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>{{ title }}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&display=swap');

*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Comfortaa', cursive, sans-serif;
    font-weight: 500;
    background-color: #fdfaf2;
    background-image: 
        radial-gradient(#f3e9dc 2px, transparent 2px), 
        radial-gradient(#f3e9dc 2px, #fdfaf2 2px);
    background-size: 32px 32px;
    background-position: 0 0, 16px 16px;
    color: #4a3c31;
    -webkit-font-smoothing: antialiased;
}

.chat {
    max-width: 720px;
    margin: 20px auto;
    padding: 16px;
    width: 100%;
}

.msg {
    display: flex;
    margin: 30px 0;
    align-items: flex-end;
    break-inside: avoid;
    page-break-inside: avoid;
}

.left { justify-content: flex-start; }
.right { justify-content: flex-end; }

.msg-col {
    display: flex;
    flex-direction: column;
    max-width: 75%;
}

.left .msg-col { align-items: flex-start; }
.right .msg-col { align-items: flex-end; }

.avatar {
    width: 44px;
    height: 44px;
    border: 1px solid #ddb892;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin: 0 12px;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(221, 184, 146, 0.15);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.bubble {
    position: relative;
    padding: 14px 18px;
    font-size: 19px;
    line-height: 1.6;
    border: 1px solid;
    word-wrap: break-word;
    width: fit-content;
    break-inside: avoid;
    page-break-inside: avoid;

}

.left .bubble {
    background: #ffffff;
    border-color: #e6ccb2;
    border-radius: 20px 20px 20px 4px;
    box-shadow: 0 4px 12px rgba(230, 204, 178, 0.1);
}

.right .bubble {
    background: #fff5eb;
    border-color: #ddb892;
    border-radius: 20px 20px 4px 20px;
    box-shadow: 0 4px 12px rgba(221, 184, 146, 0.15);
}

.name {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.system {
    text-align: center;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.5;
    color: #b56576;
    margin: 40px auto;
    padding: 10px 24px;
    border: 1px dashed #e56b6f;
    border-radius: 18px;
    background: #fff0f1;
    max-width: 85%;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(229, 107, 111, 0.05);
    break-inside: avoid;
    page-break-inside: avoid;
}

.meta {
    font-size: 13px;
    margin-top: 10px;
    padding-top: 8px;
}

.left .meta {
    border-top: 1px dashed #e6ccb2;
    color: #7f6a5b;
}

.right .meta {
    border-top: 1px dashed #ddb892;
    color: #7f6a5b;
}

.reactions {
    position: absolute;
    bottom: -18px;
    background: #ffffff;
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 13px;
    display: flex;
    gap: 4px;
    align-items: center;
    z-index: 10;
    white-space: nowrap;
    box-shadow: 0 3px 8px rgba(221, 184, 146, 0.2);
}

.left .reactions { 
    right: 14px; 
    border: 1px solid #e6ccb2;
}
.right .reactions { 
    left: 14px; 
    border: 1px solid #ddb892;
}

.reaction-count {
    font-weight: 700;
    color: #6c584c;
    font-size: 11px;
}

@media print {
    @page {
        size: A4;
        margin: 0 !important;
    }

    body {
        margin: 0 !important;
        padding: 0 !important;
        background-color: #ffe680 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 20mm;
        background: transparent;
        pointer-events: none;
    }

    body::after {
        content: "";
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 20mm;
        background: transparent;
        pointer-events: none;
    }

    .chat {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 20mm !important; 
        display: block !important;
    }
    .msg {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        margin-top: 6mm !important;
        margin-bottom: 6mm !important;
    }

    .system {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        margin: 10mm auto !important;
    }
}

</style>
</head>

<body>

<div class="chat" id="chat"></div>

<script type="application/json" id="book-data">
{{ json_data }}
</script>

<script>
const data = JSON.parse(document.getElementById("book-data").textContent);
const chat = document.getElementById("chat");

const charMap = new Map(data.characters.map(c => [c.id, c]));

function getColor(id) {
    const colors = ["#cb997e", "#ddb892", "#b7b7a4", "#a5a58d", "#6b705c", "#f3c68f", "#d4a373"];
    return colors[id % colors.length];
}

function getFallbackEmoji(id) {
    const icons = ['🍁', '🍂', '🦔', '🦊', '🍄', '🌰', '☕', '🧣', '🎃'];
    return icons[id % icons.length];
}

function getRandomReactions() {
    if (Math.random() > 0.7) return null;

    const emojis = ['🍁', '🍂', '🦔', '🦊', '🍄', '☕', '🧣'];
    const count = Math.random() > 0.8 ? 2 : 1;
    const selected = [];
    
    for (let i = 0; i < count; i++) {
        const r = emojis[Math.floor(Math.random() * emojis.length)];
        if (!selected.includes(r)) selected.push(r);
    }
    
    if (selected.length === 0) return null;

    const div = document.createElement("div");
    div.className = "reactions";
    div.innerHTML = selected.map(e => `
        <span>
            ${e} <span class="reaction-count">${Math.floor(Math.random() * 5) + 1}</span>
        </span>
    `).join('');
    
    return div;
}

function createMessage({ text, name, isRight, color, metaText, authorId, avatarUrl }) {
    const div = document.createElement("div");
    div.className = "msg " + (isRight ? "right" : "left");

    const av = document.createElement("div");
    av.className = "avatar";

    if (avatarUrl) {
        const img = document.createElement("img");
        img.src = avatarUrl;
        img.alt = name;
        img.onerror = function() {
            av.textContent = getFallbackEmoji(authorId);
        };
        av.appendChild(img);
    } else {
        av.textContent = getFallbackEmoji(authorId);
    }

    const col = document.createElement("div");
    col.className = "msg-col";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const textDiv = document.createElement("div");
    textDiv.textContent = text;
    bubble.appendChild(textDiv);

    if (metaText) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = metaText;
        bubble.appendChild(meta);
    }

    const reactions = getRandomReactions();
    if (reactions) {
        bubble.appendChild(reactions);
    }

    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = name;
    nameDiv.style.color = color;
    
    col.appendChild(nameDiv);
    col.appendChild(bubble);

    if (isRight) {
        div.appendChild(col);
        div.appendChild(av);
    } else {
        div.appendChild(av);
        div.appendChild(col);
    }

    return div;
}

function render(line) {
    if (!line.is_dialogue) {
        const sys = document.createElement("div");
        sys.className = "system";
        sys.textContent = line.content;
        return [sys];
    }

    let aId = line.author_id;
    let name = "Невідомий";
    let avatarUrl = null;
    
    if (aId !== null) {
        const char = charMap.get(aId);
        name = char?.name || "Невідомий";
        avatarUrl = char?.avatar || null;
    } else {
        aId = 999;
    }

    const color = getColor(aId);
    const isRight = (aId % 2 !== 0);

    const messages = [];

    if (line.parts && line.parts.length) {
        messages.push(
            createMessage({
                text: line.parts[0].trim(),
                name,
                isRight,
                color,
                metaText: line.parts[1]?.trim(),
                authorId: aId,
                avatarUrl
            })
        );

        for (let i = 2; i < line.parts.length; i++) {
            const part = line.parts[i].trim();
            if (!part) continue;

            messages.push(
                createMessage({
                    text: part,
                    name,
                    isRight,
                    color,
                    authorId: aId,
                    avatarUrl
                })
            );
        }
    } else {
        messages.push(
            createMessage({
                text: line.content,
                name,
                isRight,
                color,
                authorId: aId,
                avatarUrl
            })
        );
    }

    return messages;
}

data.lines.forEach(line => {
    render(line).forEach(el => chat.appendChild(el));
});
</script>

</body>
</html>
