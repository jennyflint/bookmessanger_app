version: '3.8'

services:
  api_app:
    build: .
    container_name: api_app
    restart: always
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - /var/www/bookmessanger_storage/model_books:/app/storage/model_books/
      - /var/www/bookmessanger_storage/upload_books:/app/storage/upload_books/
      - /var/www/bookmessanger_storage/converted_books:/app/storage/converted_books/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  worker:
    build: .
    container_name: celery_worker
    command: celery -A src.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /var/www/bookmessanger_storage/model_books:/app/storage/model_books/
      - /var/www/bookmessanger_storage/upload_books:/app/storage/upload_books/
      - /var/www/bookmessanger_storage/converted_books:/app/storage/converted_books/
    networks:
      - app-network
  playwright_browser:
    image: ghcr.io/browserless/chromium:latest
    container_name: playwright_browser
    restart: always
    ports:
      - "${PLAYWRIGHT_WS_PORT:-3000}:3000"
    environment:
      - KEEP_ALIVE=true
      - MAX_CONCURRENT_SESSIONS=5
    networks:
      - app-network

  redis:
    image: redis:8.6-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network
  flower:
    build: .
    container_name: celery_flower
    command: celery -A src.celery_app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app-network:
    driver: bridge
    name: bookmessanger_network